<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Varsha · Rain forecast</title>
  <meta name="description" content="Rain forecast for any place on Earth, from ECMWF Open Data.">

  <!-- MapLibre: the map library -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>

  <!-- The map fills the whole screen -->
  <div id="map"></div>

  <!-- Search bar, top left -->
  <div id="search">
    <div id="search-bar">
      <svg id="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
      </svg>
      <input id="search-input" type="text" placeholder="Search for a place"
             autocomplete="off" spellcheck="false" aria-label="Search for a place">
      <button id="search-clear" type="button" aria-label="Clear" hidden>&times;</button>
    </div>
    <ul id="suggestions" hidden></ul>
  </div>

  <!-- The app's name, top right -->
  <div id="brand">Varsha</div>

  <!-- Which map: colour by rain amount, or by rain type -->
  <div id="mode" role="group" aria-label="Map colours" hidden>
    <button type="button" data-mode="amount" aria-pressed="true">Rain amount</button>
    <button type="button" data-mode="type" aria-pressed="false">Rain type</button>
  </div>

  <!-- Colour key for the rain shown on the map, bottom left -->
  <div id="legend" hidden>
    <div id="legend-when"></div>
    <div id="legend-bar"></div>
    <div id="legend-unit">mm per 3 hours</div>
  </div>

  <!-- Bottom panel: the 4-day forecast for the selected place -->
  <section id="panel" hidden>
    <header id="panel-head">
      <div>
        <h2 id="panel-title"></h2>
        <p id="panel-place"></p>
        <p id="panel-note"></p>
      </div>
      <button id="panel-close" type="button" aria-label="Close">&times;</button>
    </header>
    <div id="panel-body"></div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
  <!-- tz-lookup: finds a place's time zone from its latitude and longitude -->
  <script src="https://cdn.jsdelivr.net/npm/tz-lookup@6.1.25/tz.js"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
