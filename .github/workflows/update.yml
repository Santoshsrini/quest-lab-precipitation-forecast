# Fetches the newest ECMWF rain forecast and publishes the site.
#
# Runs four times a day, shortly after each ECMWF run is published, and
# whenever the page or the data script changes. If any step fails, nothing
# is published and the live site keeps its previous data.

name: Update forecast and publish

on:
  schedule:
    # 01:00, 08:00, 13:00 and 20:00 UTC. ECMWF publishes its 18, 00, 06 and
    # 12 UTC runs about 7 hours after each starts.
    - cron: "0 1,8,13,20 * * *"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pipeline/**"
      - ".github/workflows/update.yml"
  workflow_dispatch:        # lets the job be started by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one run at a time; a newer run waits for the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install the Python packages
        run: pip install -r pipeline/requirements.txt

      - name: Download the forecast and write the tiles
        run: python pipeline/fetch_forecast.py

      - name: Check the output
        working-directory: pipeline
        run: python check_output.py

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site (page and data)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
